  ShiftLeft:'run', ShiftRight:'run', KeyK:'run'
};
window.addEventListener('keydown', function(e){
  var k = KEYMAP[e.code];
  if(k){
    e.preventDefault();
    if(k === 'jump' && !keys.jump) keys.jumpBuf = 0.16;
    keys[k] = true;
  }
  if(e.code === 'Escape' || e.code === 'KeyP'){
    if(G.state === 'playing') pauseGame(); else if(G.state === 'paused') resumeGame();
  }
  if(e.code === 'KeyR' && (G.state === 'playing' || G.state === 'paused')) restartCurrent();
});
window.addEventListener('keyup', function(e){
  var k = KEYMAP[e.code];
  if(k) keys[k] = false;
});
window.addEventListener('blur', function(){
  keys.left = keys.right = keys.jump = keys.run = false;
});

/* ---------- 手机：多点触控区（可滑动切换，同时按住左右+跳） ---------- */
var touchZones = new Map();   /* identifier -> zone */
var touchLayer = $('touch');
if(IS_MOBILE) touchLayer.classList.add('on');

/* 优先按按钮真实位置判定，其次回退到屏幕分区（手滑到按钮外也能操作） */
var zoneRects = null;
function refreshZoneRects(){
  zoneRects = [];
  var pads = touchLayer.querySelectorAll('.tbtn');
  for(var i=0;i<pads.length;i++){
    var r = pads[i].getBoundingClientRect();
    if(!r.width) continue;
    zoneRects.push({
      z: pads[i].getAttribute('data-zone'),
      x0: r.left-12, y0: r.top-12, x1: r.right+12, y1: r.bottom+12
    });
  }
}
function zoneOf(clientX, clientY){
  if(!zoneRects) refreshZoneRects();
  for(var i=0;i<zoneRects.length;i++){
    var zr = zoneRects[i];
    if(clientX >= zr.x0 && clientX <= zr.x1 && clientY >= zr.y0 && clientY <= zr.y1) return zr.z;
  }
  var r = touchLayer.getBoundingClientRect();
  if(!r.width) return null;
  var x = (clientX - r.left) / r.width;
  var y = (clientY - r.top) / r.height;
  if(y < 0.3) return null;                           /* 顶部让给 HUD */
  if(x < 0.25) return 'left';
  if(x < 0.45) return 'right';
  if(x >= 0.7) return 'jump';
  return null;
}
function syncTouch(){
  var has = function(z){
    var yes = false;
    touchZones.forEach(function(v){ if(v === z) yes = true; });
    return yes;
  };
  var wasJump = keys.jump;
  keys.left = has('left');
  keys.right = has('right');
  keys.run = has('run');
  keys.jump = has('jump');
  if(keys.jump && !wasJump) keys.jumpBuf = 0.16;
  var pads = touchLayer.querySelectorAll('.tbtn');
  for(var i=0;i<pads.length;i++){
    var z = pads[i].getAttribute('data-zone');
    pads[i].classList.toggle('act', has(z));
  }
}
function onTouch(e){
  if(G.state === 'menu' || G.state === 'select') { /* 只在游戏内接管 */ }
  for(var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if(e.type === 'touchend' || e.type === 'touchcancel'){
      touchZones.delete(t.identifier);
    }else{
      var z = zoneOf(t.clientX, t.clientY);
      if(z) touchZones.set(t.identifier, z); else touchZones.delete(t.identifier);
    }
  }
  syncTouch();
  if(e.cancelable) e.preventDefault();
  audioUnlock();
}
touchLayer.addEventListener('touchstart', onTouch, {passive:false});
touchLayer.addEventListener('touchmove', onTouch, {passive:false});
touchLayer.addEventListener('touchend', onTouch, {passive:false});
touchLayer.addEventListener('touchcancel', onTouch, {passive:false});

/* 桌面端也允许用鼠标按住虚拟键（方便调试） */
(function(){
  var pads = touchLayer.querySelectorAll('.tbtn');
  for(var i=0;i<pads.length;i++){
    (function(el){
      var z = el.getAttribute('data-zone');
      el.addEventListener('mousedown', function(e){ e.preventDefault(); touchZones.set('mouse-'+z, z); syncTouch(); audioUnlock(); });
      el.addEventListener('mouseup', function(){ touchZones.delete('mouse-'+z); syncTouch(); });
      el.addEventListener('mouseleave', function(){ touchZones.delete('mouse-'+z); syncTouch(); });
    })(pads[i]);
  }
})();

/* 首次交互解锁音频（iOS 需要） */
['touchstart','mousedown','keydown'].forEach(function(ev){
  window.addEventListener(ev, function once(){ audioUnlock(); window.removeEventListener(ev, once); });
});

/* ============================ 关卡生成 ============================ */
function buildLevel(levelIndex, words, seed){
  var def = LEVELS[levelIndex] || {id:'WX',unit:'练习',name:'错词重练',theme:'cave'};
  var th = THEMES[def.theme] || THEMES.grass;
  var R = mulberry32(seed + levelIndex*7919 + 11);
  var startX = 8*TILE;
  var n = words.length;
  var levelEnd = startX + n*GATE_SP + 16*TILE;

  var solids = [], coins = [], enemies = [], gates = [], decor = [], qblocks = [];

  /* --- 地面与坑 --- */
  var pits = [];
  for(var i=0;i<n-1;i++){
    if(R() < 0.5){
      var px = startX + i*GATE_SP + 9*TILE;
      var pw = (R() < 0.3 ? 3.2 : 2.2) * TILE;
      pits.push([px, px + pw]);
    }
  }
  /* 终点前的最后一个坑放一块悬空桥板，做出马里奥式的连续跳 */
  pits.sort(function(a,b){ return a[0]-b[0]; });
  var segs = [], cursor = -3*TILE;
  pits.forEach(function(p){
    if(p[0] > cursor + 4*TILE) segs.push([cursor, p[0]]);
    cursor = Math.max(cursor, p[1]);
  });
  segs.push([cursor, levelEnd + 10*TILE]);
  segs.forEach(function(s){
    if(s[1]-s[0] < 6*TILE) return;
    solids.push({x:s[0], y:GROUND_Y, w:s[1]-s[0], h:240, type:'ground'});
  });
  function segOf(x){
    for(var i=0;i<segs.length;i++){ if(x>=segs[i][0] && x<=segs[i][1]) return segs[i]; }
    return segs[segs.length-1];
  }
  /* 坑上方搭一段悬空砖台 */
  pits.forEach(function(p, i){
    if(i % 2 === 0){
      var mx = (p[0]+p[1])/2;
      solids.push({x:mx-BW, y:GROUND_Y-2.1*TILE, w:BW*2, h:22, type:'plat'});
      coins.push({x:mx, y:GROUND_Y-2.9*TILE, r:14, got:false, t:R()*6});
    }
  });

  /* --- 水管（马里奥标志物，可站可挡） --- */
  for(var p2=0;p2<Math.floor(n/3);p2++){
    var pipeX = startX + (p2*3 + 2)*GATE_SP + 7*TILE;
    var sg = segOf(pipeX);
    if(pipeX + 2*TILE < sg[1] - TILE){
      solids.push({x:pipeX, y:GROUND_Y-2*TILE, w:2*TILE, h:2*TILE, type:'pipe'});
    }
  }

  /* --- 终点前的金字塔台阶 --- */
  var stairBase = startX + n*GATE_SP + 3*TILE;
  var stairH = 4;
  for(var s1=0;s1<stairH;s1++){
    for(var s2=0;s2<=s1;s2++){
      solids.push({x:stairBase + (s1*1)*BW, y:GROUND_Y-(s2+1)*BH - 0, w:BW, h:BH, type:'stair'});
    }
  }

  /* --- 每词一个答题门 --- */
  for(var w=0;w<n;w++){
    var gateX = startX + w*GATE_SP;
    var word = words[w];
    var opts = [word], guard = 0;
    while(opts.length < 3 && guard++ < 600){
      var c = WORDS[Math.floor(R()*WORDS.length)];
      if(!c || c.g === word.g) continue;
      var dup = false;
      for(var q=0;q<opts.length;q++){ if(opts[q].g === c.g) dup = true; }
      if(!dup) opts.push(c);
    }
    for(var j=opts.length-1;j>0;j--){
      var k = Math.floor(R()*(j+1)), tmp = opts[j];
      opts[j] = opts[k]; opts[k] = tmp;
    }
    var correctIdx = 0;
    for(var q2=0;q2<opts.length;q2++){ if(opts[q2].g === word.g) correctIdx = q2; }
    var blocks = opts.map(function(o, j){
      return {
        x: gateX + (j-1)*150 - QW/2, y: QY, w: QW, h: QH,
        gloss: o.g, correct: j === correctIdx, state:'locked', shake:0
      };
    });
    gates.push({x:gateX, word:word, blocks:blocks, state:'locked', tries:0, firstTry:true});

    /* 答题门下给一小段站台，方便起跳 */
    solids.push({x:gateX-3.2*TILE, y:GROUND_Y, w:6.4*TILE, h:240, type:'ground'});

    /* 问号砖：可能出金币 / 蘑菇 / 星星 */
    if(R() < 0.7){
      var qx = gateX + 6.6*TILE;
      var sg2 = segOf(qx);
      if(qx + BW < sg2[1] - TILE){
        var roll = R();
        qblocks.push({x:qx, y:GROUND_Y-4.1*TILE, w:BW, h:BH, kind:'q', used:false,
          item: roll < 0.16 ? 'mushroom' : (roll < 0.24 ? 'star' : null), bump:0});
        if(R() < 0.6){
          qblocks.push({x:qx+BW, y:GROUND_Y-4.1*TILE, w:BW, h:BH, kind:'b', used:false, item:null, bump:0});
        }
      }
    }
    /* 金币弧 */
    if(R() < 0.65){
      var cx = gateX + 4.4*TILE;
      for(var cc=0;cc<4;cc++){
        coins.push({x:cx+cc*0.85*TILE, y:GROUND_Y-1.6*TILE-Math.sin(cc/3*Math.PI)*0.9*TILE,
          r:13, got:false, t:R()*6});
      }
    }
    /* 高台 + 金币 */
    if(R() < 0.5){
      var plx = gateX + 11.5*TILE, ply = GROUND_Y - 2.6*TILE;
      var sg3 = segOf(plx+2*TILE);
      if(plx + 4*TILE < sg3[1] - TILE){
        solids.push({x:plx, y:ply, w:4*TILE, h:22, type:'plat'});
        coins.push({x:plx+1*TILE, y:ply-0.9*TILE, r:13, got:false, t:R()*6});
        coins.push({x:plx+2.4*TILE, y:ply-0.9*TILE, r:13, got:false, t:R()*6});
      }
    }
    decor.push({x:gateX + 1.5*TILE + R()*3*TILE, s:0.8+R()*0.4, k:th.deco});
    decor.push({x:gateX + 10.5*TILE + R()*3*TILE, s:0.7+R()*0.45, k:th.deco});
  }

  /* --- 敌人：走地 / 飞行 / 带刺 --- */
  for(var e=0;e<n;e++){
    var roll2 = R();
    if(roll2 > 0.72) continue;
    /* 关键：敌人必须远离答题门，否则玩家跳起来答题时会被撞 */
    var gateX = startX + e*GATE_SP;
    var eLo = gateX + 4.3*TILE, eHi = gateX + 11.4*TILE;
    var ex = eLo + R()*(eHi - eLo);
    var sg4 = segOf(ex);
    var a = Math.max(eLo, sg4[0] + 1.2*TILE);
    var b = Math.min(eHi, sg4[1] - 1.8*TILE);
    if(b - a < 1.6*TILE) continue;
    ex = clamp(ex, a, b);
    var half = Math.max(0.7*TILE, Math.min(2.2*TILE, (b - a)/2));
    if(roll2 < 0.14){                       /* 飞行怪 */
      enemies.push({kind:'fly', x:ex, y:GROUND_Y-4.2*TILE, w:40, h:36,
        baseY:GROUND_Y-4.2*TILE, amp:34+R()*26, ph:R()*6.3, vx:52*(R()<0.5?-1:1),
        x0:Math.max(a, ex-half), x1:Math.min(b, ex+half), alive:true, t:R()*6});
    }else if(roll2 < 0.26){                 /* 带刺怪，不能踩 */
      enemies.push({kind:'spike', x:ex, y:GROUND_Y-42, w:42, h:42, vx:60*(R()<0.5?-1:1),
        x0:Math.max(a, ex-half), x1:Math.min(b, ex+half), alive:true, t:R()*6});
    }else{                                  /* 普通走地怪 */
      enemies.push({kind:'walker', x:ex, y:GROUND_Y-42, w:42, h:42, vx:78*(R()<0.5?-1:1),
        x0:Math.max(a, ex-half), x1:Math.min(b, ex+half), alive:true, t:R()*6});
    }
  }

  return {
    def:def, th:th, solids:solids, coins:coins, enemies:enemies, gates:gates,
    decor:decor, qblocks:qblocks, items:[], segs:segs,
    levelEnd:levelEnd, flagX: startX + n*GATE_SP + 9.5*TILE, spawn: 3.4*TILE
  };
}

var G = {
  state:'boot', levelIndex:0, customWords:null, lv:null, player:null,
  cam:0, hearts:MAX_HEARTS, score:0, coinsRun:0, t:0, startedAt:0, timeLeft:START_TIME,
  activeGate:0, wrongCount:0, correctFirst:0, streak:0, bestStreak:0,
  particles:[], popups:[], invuln:0, shake:0, checkpoint:0,
  finished:false, big:false, star:0, dead:0, flagSlide:0, banner:0
};

function newPlayer(x){
  return {
    x:x, y:GROUND_Y-46, w:32, h:46, vx:0, vy:0,
    onGround:false, coyote:0, face:1, anim:0, prevBottom:GROUND_Y, win:0
  };
}
function setBig(on){
  var p = G.player;
  if(!p) return;
  var nh = on ? 64 : 46, nw = on ? 40 : 32;
  p.y += (p.h - nh);          /* 保持脚底位置 */

/* ============================ HUD ============================ */
function renderHearts(){
  var s = '';

  $('hearts').innerHTML = s;
}
function renderStats(){
  $('score').textContent = G.score;
  $('coins').textContent = G.coinsRun;
  $('timer').textContent = save.timer ? fmtTime(G.timeLeft) : '∞';
  $('timer').className = (save.timer && G.timeLeft <= 30) ? 'low' : '';
}
function tierName(t){ return t === 1 ? '易' : (t === 2 ? '中' : '难'); }
function updateQuestion(){
  var lv = G.lv;
  if(!lv) return;
  var gate = lv.gates[G.activeGate];
  if(!gate){
    $('qword').textContent = '全部答完！';
    $('qmeta').innerHTML = '冲向终点旗 →';
    $('qtier').textContent = '';
    $('qtier').className = 'tier';
    return;
  }
  var w = gate.word;
  $('qword').textContent = w.w;
  $('qmeta').innerHTML = '第 <b>' + (G.activeGate+1) + '/' + lv.gates.length + '</b>' +
    (w.ph ? '　/' + w.ph + '/' : '') +
    (w.f ? '　考频 <b>' + w.f + '</b>' : '');
  $('qtier').textContent = tierName(w.t);
  $('qtier').className = 'tier t' + w.t;
}
var toastTimer = null;
function toast(html, kind, ms){
  var el = $('toast');
  el.className = 'show ' + (kind || '');
  el.innerHTML = html;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = ''; }, ms || 1600);
}
function showOverlay(html){
  $('card').innerHTML = html;
  $('overlay').classList.add('show');
  $('hud').style.opacity = '0';
  $('touch').classList.add('hide');
  touchZones.clear(); syncTouch();

function starHtml(n){

function wordRow(w, extra, cls){

function bindSpeak(root){

/* ============================ 开局 ============================ */
function prepareRun(levelIndex, words, defOverride){
  G.levelIndex = levelIndex;
  G.customDef = defOverride || null;
  zoneRects = null;
  G.lv = buildLevel(levelIndex, words, 20261210);
  if(defOverride) G.lv.def = defOverride;
  G.player = newPlayer(G.lv.spawn);
  G.cam = 0;
  G.hearts = MAX_HEARTS;
  G.score = 0; G.coinsRun = 0;
  G.timeLeft = START_TIME;
  G.activeGate = 0; G.wrongCount = 0; G.correctFirst = 0;
  G.streak = 0; G.bestStreak = 0;
  G.particles = []; G.popups = [];
  G.invuln = 0; G.shake = 0; G.finished = false;
  G.big = false; G.star = 0; G.dead = 0; G.flagSlide = 0;
  G.banner = 2.0;
  G.startedAt = performance.now();
  G.checkpoint = G.lv.spawn;
  for(var i=0;i<G.lv.gates.length;i++){
    var g = G.lv.gates[i];
    g.state = (i===0 ? 'active' : 'locked');
    for(var j=0;j<g.blocks.length;j++) g.blocks[j].state = (i===0 ? 'active' : 'locked');
  }
  hideOverlay();
  G.state = 'playing';
  renderHearts(); renderStats(); updateQuestion();
  checkOrientation();
}
function startLevel(levelIndex){
  G.customWords = null;
  var def = LEVELS[levelIndex];
  if(!def) return;
  maybeFullscreen();
  prepareRun(levelIndex, WORDS.slice(def.from, def.to), null);
}
function startWrongDrill(){
  var ids = Object.keys(save.wrongBook).map(Number)
    .sort(function(a,b){ return (save.wrongBook[b]||0) - (save.wrongBook[a]||0); });
  var w = ids.map(function(i){ return WORDS[i]; }).filter(Boolean);
  /* 错词本做成关卡列表：每 20 个错词一关 */
  G.state = 'wrong';
  var html = '';
  if(w.length){
    var total = Math.ceil(w.length / 20);
    for(var c=0;c<total;c++){
      var chunk = w.slice(c*20, c*20+20);
      html += '<button class="lvl" data-w="' + c + '">' +
        '<div class="no">错词关 ' + (c+1) + '　<span class="wc">' + chunk.length + ' 词</span></div>' +
        '<div class="nm">' + chunk[0].w + ' …</div>' +
        '<div class="stars">' + starHtml(save.stars['WB'+c] || 0) + '</div>' +
      '</button>';
    }
  }
  showOverlay(
    '<h2>错词本闯关</h2>' +
    (w.length
      ? '<p>错词本里现在有 <b>' + w.length + '</b> 个词，每 20 个一关，共 <b>' + Math.ceil(w.length/20) +
        '</b> 关。答对就会自动从错词本里移除，越打越少。</p><div class="grid">' + html + '</div>'
      : '<p>错词本还是空的。答错的单词会自动进来，之后就能在这里专门刷它们。</p>') +
    '<div class="btnRow">' +
      '<button class="btn ghost" id="back">返回主菜单</button>' +
      '<button class="btn ghost" id="wb">生词表（全部单词）</button>' +
    '</div>'
  );
  $('back').onclick = menu;
  $('wb').onclick = function(){ wordBook(); };
  var els = document.querySelectorAll('.lvl');
  for(var k=0;k<els.length;k++){
    (function(el){
      el.onclick = function(){
        var idx = parseInt(el.getAttribute('data-w'), 10) || 0;
        var all = Object.keys(save.wrongBook).map(Number)
          .sort(function(a,b){ return (save.wrongBook[b]||0) - (save.wrongBook[a]||0); })
          .map(function(i){ return WORDS[i]; }).filter(Boolean);
        var part = all.slice(idx*20, idx*20+20);
        if(!part.length) return;
        startWrongLevel(part, idx);
      };
    })(els[k]);
  }
}
function startWrongLevel(chunk, idx){
  maybeFullscreen();
  G.customWords = chunk;
  prepareRun(0, chunk, {id:'WB'+(idx||0), unit:'错词本', name:'错词关 ' + ((idx||0)+1), theme:'cave'});
}
function startPractice(levelIndex){
  var d = LEVELS[levelIndex];
  if(!d) return;
  maybeFullscreen();
  G.customWords = WORDS.slice(d.from, d.to);
  prepareRun(levelIndex, G.customWords, {id:'PR'+d.id, unit:'练习', name:d.unit + ' ' + d.name, theme:d.theme});
}
/* 重打当前这一关（含错词本关 / 生词表练习关） */
function restartCurrent(){
  if(G.customWords) prepareRun(G.levelIndex, G.customWords, G.customDef);
  else startLevel(G.levelIndex);
}

/* ============================ 反馈 ============================ */
function burst(x, y, color, n){
  var many = IS_MOBILE ? 0.6 : 1;
  n = Math.round((n||12) * many);
  for(var i=0;i<n;i++){
    G.particles.push({x:x, y:y, vx:rand(-210,210), vy:rand(-350,-60),
      life:rand(0.45,0.95), t:0, s:rand(2.5,6), c:color, g:rand(600,1000)});
  }
}
function popup(x, y, text, color){
  G.popups.push({x:x, y:y, text:text, c:color||'#fff', t:0, life:0.9});
}
function markWrong(word){
  var i = WORDS.indexOf(word);
  if(i < 0) return;
  save.wrongBook[i] = (save.wrongBook[i]||0) + 1;
  save.persist();
}
function clearWrong(word){
  var i = WORDS.indexOf(word);
  if(i >= 0 && save.wrongBook[i]){ delete save.wrongBook[i]; save.persist(); }
}
function damage(msg, force){
  if(!force && G.invuln > 0.6) return;
  if(G.star > 0) return;
  if(G.big){                       /* 变大状态先变小，不扣心 */
    setBig(false);
    G.invuln = 1.6; G.shake = 10;
    SFX.hurt();
    toast('被撞小了！再挨一下就要掉心', 'bad', 1600);
    return;
  }
  G.hearts = Math.max(0, G.hearts - 1);
  renderHearts();
  G.invuln = 1.3; G.shake = 13;
  G.streak = 0;
  SFX.bad();
  if(msg) toast('❌ ' + msg, 'bad', 2000);
  if(G.hearts <= 0) setTimeout(levelFailed, 500);
}

/* ============================ 答题 ============================ */
function onBlockTouched(block, gate){
  if(gate.state !== 'active') return;
  var word = gate.word;
  if(block.correct){
    gate.state = 'done';
    block.state = 'correct';
    for(var i=0;i<gate.blocks.length;i++){
      var b = gate.blocks[i];
      if(b !== block) b.state = (b.state === 'wrong' ? 'wrong' : 'dim');
    }
    var base = gate.firstTry ? 100 : 35;
    G.score += base;
    if(gate.firstTry){
      G.correctFirst++;
      G.streak++;
      if(G.streak > G.bestStreak) G.bestStreak = G.streak;
      if(G.streak > 0 && G.streak % 5 === 0){
        G.score += 200;
        popup(block.x + block.w/2, block.y - 20, '连击 x' + G.streak + '  +200', '#ffd23f');
        SFX.power();
      }
    }else{
      G.streak = 0;
    }
    popup(block.x + block.w/2, block.y - 14, '+' + base, '#ffe9a3');
    renderStats();
    clearWrong(word);
    burst(block.x + block.w/2, block.y + 12, '#ffd23f', 26);
    burst(block.x + block.w/2, block.y + 12, '#7ee08a', 12);
    SFX.good();
    speak(word.w);
    toast('✅ <b>' + word.w + '</b>' + (word.ph ? ' /' + word.ph + '/' : '') + '　' +
      word.g + '　<span style="opacity:.82">' + word.m + '</span>', 'good', 2400);
    var next = G.activeGate + 1;
    if(next < G.lv.gates.length){
      G.activeGate = next;
      var ng = G.lv.gates[next];
      ng.state = 'active';
      for(var j=0;j<ng.blocks.length;j++) ng.blocks[j].state = 'active';
      G.checkpoint = ng.x - 3*TILE;
    }else{
      G.activeGate = G.lv.gates.length;
      G.checkpoint = G.lv.flagX - 5*TILE;
      SFX.clear();
      toast('🎉 单词全部答对！去终点滑旗杆', 'good', 2600);
    }
    updateQuestion();
  }else{
    gate.firstTry = false;
    gate.tries++;
    block.state = 'wrong';
    block.shake = 1;
    markWrong(word);
    G.wrongCount++;
    G.streak = 0;
    damage('<b>' + word.w + '</b> 不是「' + block.gloss + '」', true);
  }
}

/* --------- 问号块 / 砖块 --------- */
function spawnItem(kind, x, y){
  G.lv.items.push({
    kind:kind, x:x, y:y, w:34, h:34,
    vx: kind === 'mushroom' ? 118 : 86,
    vy: kind === 'star' ? -430 : -220,
    dir: 1, t:0
  });
}
function bumpQBlock(q){
  if(q.used) return;
  q.used = true;
  q.bump = 1;
  if(q.kind === 'b'){
    SFX.brick();
    burst(q.x + q.w/2, q.y + q.h/2, q.__th ? q.__th.top : '#c9762f', 14);
    q.broken = true;
    return;
  }
  if(q.item){
    spawnItem(q.item, q.x + 4, q.y - 34);
    SFX.power();
    toast(q.item === 'star' ? '⭐ 星火出现！吃了它短时间无敌' : '🍄 星火菇出现！吃了它变大', 'good', 1800);
  }else{
    G.coinsRun++; G.score += 20;
    renderStats();
    popup(q.x + q.w/2, q.y - 12, '+20', '#ffe9a3');
    burst(q.x + q.w/2, q.y - 6, '#ffd23f', 12);
    SFX.coin();
  }
}

/* ============================ 物理与逻辑 ============================ */
function solidsOf(lv){
  var out = [];
  for(var i=0;i<lv.solids.length;i++){
    var s = lv.solids[i];
    if(s.x + s.w < G.cam - 200 || s.x > G.cam + VW + 200) continue;
    out.push(s);
  }
  for(var j=0;j<lv.qblocks.length;j++){
    var q = lv.qblocks[j];
    if(q.broken) continue;
    if(q.x + q.w < G.cam - 200 || q.x > G.cam + VW + 200) continue;
    out.push(q);
  }
  return out;
}
function activeQuizBlocks(lv){
  var out = [];
  for(var i=0;i<lv.gates.length;i++){
    var g = lv.gates[i];
    if(g.state !== 'active') continue;
    for(var j=0;j<g.blocks.length;j++){
      if(g.blocks[j].state === 'active') out.push({b:g.blocks[j], g:g});
    }
  }
  return out;
}
function resolveX(p, s){
  if(p.vx > 0) p.x = s.x - p.w;
  else if(p.vx < 0) p.x = s.x + s.w;
  p.vx = 0;
}
function resolveY(p, s){
  if(p.vy > 0){ p.y = s.y - p.h; p.vy = 0; p.onGround = true; }
  else if(p.vy < 0){ p.y = s.y + s.h; p.vy = 80; }
}

function update(dt){
  var p = G.player, lv = G.lv;
  if(!p || !lv) return;

  if(G.invuln > 0) G.invuln -= dt;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*40);
  if(G.star > 0) G.star = Math.max(0, G.star - dt);
  if(G.banner > 0) G.banner = Math.max(0, G.banner - dt);

  /* 问号块回弹动画 */
  for(var qi=0; qi<lv.qblocks.length; qi++){
    var qb = lv.qblocks[qi];
    if(qb.bump > 0) qb.bump = Math.max(0, qb.bump - dt*3.2);
  }

  /* ---------- 滑旗杆（结算动画） ---------- */
  if(G.flagSlide > 0){
    G.flagSlide += dt;
    var poleY = GROUND_Y - p.h;
    p.x = lv.flagX - 6;
    p.vy = 0;
    if(p.y < poleY){ p.y = Math.min(poleY, p.y + 300*dt); }
    G.cam = lerp(G.cam, clamp(p.x - VW*0.35, 0, Math.max(0, lv.levelEnd - VW)), 1 - Math.pow(0.0012, dt));
    stepEffects(dt);
    if(G.flagSlide > 1.6 && G.state === 'playing') levelClear();
    return;
  }

  /* ---------- 水平移动 ---------- */
  var ax = 0;
  if(keys.left) ax -= 1;
  if(keys.right) ax += 1;
  var top = (keys.run || G.star > 0) ? RUN_FAST : RUN;
  p.vx = lerp(p.vx, ax*top, p.onGround ? ACC_G : ACC_A);
  if(Math.abs(p.vx) < 8 && !ax) p.vx = 0;
  if(ax) p.face = ax > 0 ? 1 : -1;
  p.anim += dt * (2 + Math.abs(p.vx)/60);

  /* ---------- 跳跃 ---------- */
  if(keys.jumpBuf > 0) keys.jumpBuf -= dt;
  if(keys.jumpBuf > 0 && (p.onGround || p.coyote > 0)){
    p.vy = JUMP_V;
    p.onGround = false;
    p.coyote = 0;
    keys.jumpBuf = 0;
    SFX.jump();
  }
  if(p.onGround) p.coyote = 0.11;
  else if(p.coyote > 0) p.coyote -= dt;
  if(!keys.jump && p.vy < -280) p.vy += 2600*dt;    /* 松手 = 矮跳 */

  p.vy = Math.min(MAX_FALL, p.vy + GRAVITY*dt);
  p.prevBottom = p.y + p.h;

  /* ---------- X 轴碰撞 ---------- */
  var sol = solidsOf(lv);
  p.x += p.vx*dt;
  for(var i=0;i<sol.length;i++){ if(hit(p, sol[i])) resolveX(p, sol[i]); }
  var qb1 = activeQuizBlocks(lv);
  for(var k=0;k<qb1.length;k++){
    if(hit(p, qb1[k].b)){ resolveX(p, qb1[k].b); }
  }

  /* ---------- Y 轴碰撞 ---------- */
  p.y += p.vy*dt;
  p.onGround = false;
  for(var i2=0;i2<sol.length;i2++){
    var s2 = sol[i2];
    if(!hit(p, s2)) continue;
    var fromBelow = p.vy < 0;
    resolveY(p, s2);
    if(fromBelow && s2.kind) bumpQBlock(s2);
  }
  var qb2 = activeQuizBlocks(lv);
  for(var k2=0;k2<qb2.length;k2++){
    var qq = qb2[k2];
    if(hit(p, qq.b)){
      resolveY(p, qq.b);
      onBlockTouched(qq.b, qq.g);
    }
  }
  if(p.x < 0){ p.x = 0; p.vx = 0; }

  /* ---------- 掉坑 ---------- */
  if(p.y > VH + 300){
    G.hearts = Math.max(0, G.hearts - 1);
    renderHearts();
    G.streak = 0;
    SFX.hurt();
    if(G.hearts <= 0){ levelFailed(); return; }
    p.x = G.checkpoint;
    p.y = GROUND_Y - p.h - 1.5*TILE;
    p.vx = 0; p.vy = 0;
    G.invuln = 1.4;
    toast('掉下去啦，回到上一个答题点', 'bad', 1600);
  }

  /* ---------- 金币 ---------- */
  for(var c=0;c<lv.coins.length;c++){
    var co = lv.coins[c];
    if(co.got) continue;
    co.t += dt;
    if(Math.abs(co.x-(p.x+p.w/2)) < co.r+20 && Math.abs(co.y-(p.y+p.h/2)) < co.r+26){
      co.got = true;
      G.score += 10; G.coinsRun++;
      renderStats();
      SFX.coin();
      burst(co.x, co.y, '#ffd23f', 8);
    }
  }

  /* ---------- 道具 ---------- */
  for(var it=lv.items.length-1; it>=0; it--){
    var m = lv.items[it];
    m.t += dt;
    m.vy += 1800*dt;
    m.x += m.vx*dt;
    m.y += m.vy*dt;
    var mLand = false;
    for(var si=0; si<sol.length; si++){
      var ss = sol[si];
      if(ss.kind) continue;
      if(hit(m, ss)){
        if(m.vy > 0 && (m.y + m.h) - ss.y < 26){ m.y = ss.y - m.h; m.vy = 0; mLand = true; }
        else if(m.vx > 0){ m.x = ss.x - m.w; m.vx *= -1; }
        else { m.x = ss.x + ss.w; m.vx *= -1; }
      }
    }
    if(mLand && m.kind === 'star') m.vy = -430;
    if(m.y > VH + 400){ lv.items.splice(it,1); continue; }
    if(hit(p, m)){
      lv.items.splice(it,1);
      if(m.kind === 'mushroom'){
        if(!G.big) setBig(true);
        G.score += 100; renderStats();
        popup(m.x, m.y-10, '变大 +100', '#ffd23f');
        SFX.power();
        burst(m.x, m.y, '#ff8a3d', 18);
      }else{
        G.star = STAR_TIME;
        G.score += 150; renderStats();
        popup(m.x, m.y-10, '无敌 ' + STAR_TIME + 's +150', '#ffe066');
        SFX.power();
        burst(m.x, m.y, '#ffe066', 22);
      }
    }
  }

  /* ---------- 敌人 ---------- */
  for(var e=0;e<lv.enemies.length;e++){
    var en = lv.enemies[e];
    if(!en.alive) continue;
    en.t += dt;
    if(en.kind === 'fly'){
      en.x += en.vx*dt;
      if(en.x < en.x0 || en.x + en.w > en.x1) en.vx *= -1;
      en.y = en.baseY + Math.sin(en.t*1.7 + en.ph)*en.amp;
    }else{
      en.x += en.vx*dt;
      if(en.x < en.x0 || en.x + en.w > en.x1) en.vx *= -1;
    }
    if(!hit(p, en)) continue;
    if(G.star > 0){                     /* 无敌状态直接撞飞 */
      en.alive = false;
      G.score += 100; renderStats();
      popup(en.x, en.y-10, '+100', '#ffe066');
      burst(en.x+en.w/2, en.y+en.h/2, '#ffe066', 16);
      SFX.stomp();
      continue;
    }
    var stompable = (en.kind !== 'spike');
    if(stompable && p.vy > 90 && p.prevBottom <= en.y + 22){
      en.alive = false;
      p.vy = -560;
      G.score += 60; renderStats();
      popup(en.x, en.y-10, '+60', '#c79bee');
      SFX.stomp();
      burst(en.x+en.w/2, en.y+en.h/2, en.kind==='fly' ? '#9ad0ff' : '#c79bee', 14);
    }else if(G.invuln <= 0){
      damage(en.kind === 'spike' ? '带刺的错词怪踩不得，撞上就掉心' : '碰到错词怪，扣 1 颗心');
      p.vx = (p.x < en.x ? -1 : 1) * 300;
      p.vy = -300;
    }
  }

  /* ---------- 倒计时 ---------- */
  if(save.timer && !G.finished){
    G.timeLeft -= dt;
    if(G.timeLeft <= 0){
      G.timeLeft = 90;
      G.hearts = Math.max(0, G.hearts-1);
      renderHearts();
      G.invuln = 1.2;
      SFX.bad();
      toast('⏰ 时间到，扣 1 颗心，时间补到 1:30', 'bad', 2000);
      if(G.hearts <= 0){ levelFailed(); return; }
    }
    renderStats();
  }

  /* ---------- 终点旗杆 ---------- */
  if(!G.finished && p.x + p.w > lv.flagX){
    if(G.activeGate >= lv.gates.length){
      G.flagSlide = 0.001;
      p.x = lv.flagX - 6;
      p.vx = 0; p.vy = 0;
      SFX.flag();
      burst(lv.flagX, GROUND_Y-4*TILE, '#ffe066', 24);
      return;
    }
    p.x = lv.flagX - p.w - 2;
    p.vx = 0;
    toast('还有 ' + (lv.gates.length - G.activeGate) + ' 个单词没答完', null, 1200);
  }

  /* ---------- 相机 ---------- */
  var camTarget = clamp(p.x + p.w/2 - VW*(p.face > 0 ? 0.38 : 0.5) + p.vx*0.12,
    0, Math.max(0, lv.levelEnd - VW));
  G.cam = lerp(G.cam, camTarget, 1 - Math.pow(0.0012, dt));

  stepEffects(dt);
}

function stepEffects(dt){
  var keep = [], i;
  for(i=0;i<G.particles.length;i++){
    var pt = G.particles[i];
    pt.t += dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vy += pt.g*dt;
    if(pt.t < pt.life) keep.push(pt);
  }
  G.particles = keep;
  var keep2 = [];
  for(i=0;i<G.popups.length;i++){
    var pp = G.popups[i];
    pp.t += dt; pp.y -= 42*dt;
    if(pp.t < pp.life) keep2.push(pp);
  }
  G.popups = keep2;
  var gates = G.lv ? G.lv.gates : [];
  for(i=0;i<gates.length;i++){
    for(var j=0;j<gates[i].blocks.length;j++){
      var b = gates[i].blocks[j];
      if(b.shake > 0) b.shake = Math.max(0, b.shake - dt*2.6);
    }
  }
}

/* ============================ 主循环 ============================ */
var last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = (now - last)/1000;
  last = now;
  if(dt > 1/25) dt = 1/25;
  G.t += dt;
  if(G.state === 'playing') update(dt);
  render();
}

/* ============================ 绘制基础 ============================ */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function cloudShape(x,y,s){
  ctx.beginPath();
  ctx.arc(x, y, 26*s, 0, 6.3);
  ctx.arc(x+28*s, y-10*s, 32*s, 0, 6.3);
  ctx.arc(x+64*s, y+2*s, 24*s, 0, 6.3);
  ctx.arc(x+32*s, y+14*s, 26*s, 0, 6.3);
  ctx.fill();
}
function starShape(cx,cy,r1,r2,n){
  ctx.beginPath();
  for(var i=0;i<n*2;i++){
    var r = (i%2)?r2:r1;
    var a = -Math.PI/2 + i*Math.PI/n;
    var x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
}

/* ============================ 场景 ============================ */
function drawSky(th){
  var g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, th.sky[0]);
  g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(-40,0,VW+80,VH);

  var x = VW-118, y = 86;
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = th.night ? '#e8ecff' : '#fff8d4';
  ctx.beginPath(); ctx.arc(x,y, th.night?36:44, 0, 6.3); ctx.fill();
  ctx.globalAlpha = 0.15;
  ctx.beginPath(); ctx.arc(x,y, th.night?64:78, 0, 6.3); ctx.fill();
  ctx.restore();

  if(th.night){
    ctx.save();
    ctx.fillStyle = '#ffffff';
    for(var i=0;i<34;i++){
      var sx = (i*173) % VW, sy = (i*97) % 260;
      ctx.globalAlpha = (0.35 + 0.65*Math.abs(Math.sin(G.t*1.4 + i))) * 0.8;
      ctx.fillRect(sx, sy, 2.2, 2.2);
    }
    ctx.restore();
  }
}
function drawHills(th, off, baseY, amp, color){
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.moveTo(-140, VH);
  for(var x=-140;x<=VW+280;x+=40){
    var wx = x + off;
    var y = baseY - Math.sin(wx*0.0034)*amp - Math.sin(wx*0.0011+1.7)*amp*0.5;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(VW+280, VH);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawClouds(th, off){
  ctx.save();
  ctx.globalAlpha = th.night ? 0.13 : 0.7;
  ctx.fillStyle = '#ffffff';
  for(var i=0;i<7;i++){
    var bx = ((i*430 - off) % (VW+560) + VW+560) % (VW+560) - 280;
    var by = 58 + (i%3)*56;
    cloudShape(bx, by, 0.72 + (i%4)*0.16);
  }
  ctx.restore();
}
function drawDecor(lv){
  for(var i=0;i<lv.decor.length;i++){
    var d = lv.decor[i];
    if(d.x < G.cam-140 || d.x > G.cam+VW+140) continue;
    ctx.save();
    ctx.translate(d.x, GROUND_Y);
    ctx.scale(d.s, d.s);
    var k = d.k;
    if(k === 'tree'){
      ctx.fillStyle = '#7a4a22'; ctx.fillRect(-5,-54,10,54);
      ctx.fillStyle = '#3f9e4d';
      ctx.beginPath(); ctx.arc(0,-68,26,0,6.3); ctx.arc(-20,-56,18,0,6.3); ctx.arc(20,-56,18,0,6.3); ctx.fill();
    }else if(k === 'rock'){
      ctx.fillStyle = 'rgba(126,74,42,.9)';
      ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(-10,-44); ctx.lineTo(12,-28); ctx.lineTo(26,0); ctx.closePath(); ctx.fill();
    }else if(k === 'crystal'){
      ctx.fillStyle = 'rgba(158,128,246,.8)';
      ctx.beginPath(); ctx.moveTo(0,-62); ctx.lineTo(17,0); ctx.lineTo(-17,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(214,200,255,.5)';
      ctx.beginPath(); ctx.moveTo(0,-62); ctx.lineTo(6,0); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill();
    }else if(k === 'cloud'){
      ctx.globalAlpha = 0.92; ctx.fillStyle = '#eaf6ff'; cloudShape(-30,-34,0.6);
    }else if(k === 'lava'){
      ctx.fillStyle = 'rgba(255,116,52,.8)';
      ctx.beginPath(); ctx.moveTo(-24,0); ctx.lineTo(-8,-36); ctx.lineTo(10,-18); ctx.lineTo(24,0); ctx.closePath(); ctx.fill();
    }else if(k === 'star'){
      ctx.fillStyle = 'rgba(255,236,152,.8)'; starShape(0,-48, 9, 4.5, 5);
    }else if(k === 'coral'){
      ctx.strokeStyle = 'rgba(255,140,170,.85)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(0,-30);
      ctx.moveTo(0,-18); ctx.lineTo(-14,-40);
      ctx.moveTo(0,-24); ctx.lineTo(14,-44);
      ctx.stroke();
    }else if(k === 'gear'){
      ctx.fillStyle = 'rgba(186,178,156,.85)';
      ctx.beginPath(); ctx.arc(0,-34,18,0,6.3); ctx.fill();
      ctx.fillStyle = 'rgba(74,68,80,.95)';
      ctx.beginPath(); ctx.arc(0,-34,7,0,6.3); ctx.fill();
    }else if(k === 'ice'){
      ctx.fillStyle = 'rgba(222,246,255,.88)';
      ctx.beginPath();
      ctx.moveTo(-16,0); ctx.lineTo(-6,-46); ctx.lineTo(4,-26); ctx.lineTo(14,-52); ctx.lineTo(20,0);
      ctx.closePath(); ctx.fill();
    }else if(k === 'torch'){
      ctx.fillStyle = '#5b4a3a'; ctx.fillRect(-4,-40,8,40);
      var f = 0.7 + Math.abs(Math.sin(G.t*4 + i))*0.5;
      ctx.fillStyle = '#ff9a3c';
      ctx.beginPath(); ctx.ellipse(0,-48, 7*f, 12*f, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.ellipse(0,-48, 3.4*f, 6*f, 0, 0, 6.3); ctx.fill();
    }
    ctx.restore();
  }
}
function drawGround(s, th){
  ctx.fillStyle = th.dirt;
  ctx.fillRect(s.x, s.y, s.w, s.h);
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  for(var x = Math.floor(s.x/48)*48; x < s.x+s.w; x += 48){
    var row = 0;
    for(var y = s.y+22; y < s.y+s.h; y += 34, row++){
      ctx.fillRect(x + (row%2?18:2), y, 40, 4);
    }
  }
  ctx.fillStyle = th.top;
  ctx.fillRect(s.x, s.y, s.w, 16);
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(s.x, s.y, s.w, 4);
}
function drawPipe(s){
  var g = ctx.createLinearGradient(s.x,0,s.x+s.w,0);
  g.addColorStop(0,'#3f9e4d'); g.addColorStop(0.4,'#7fd45a'); g.addColorStop(1,'#2f7a3a');
  ctx.fillStyle = g;
  ctx.fillRect(s.x+6, s.y+22, s.w-12, s.h-22);
  ctx.fillStyle = '#2f7a3a';
  ctx.fillRect(s.x, s.y, s.w, 26);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.fillRect(s.x+8, s.y+4, 10, 18);
  ctx.fillRect(s.x+12, s.y+30, 8, s.h-34);
}
function drawStair(s, th){
  ctx.fillStyle = th.dirt;
  ctx.fillRect(s.x, s.y, s.w, s.h);
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.fillRect(s.x, s.y, s.w, 5);

function drawPlat(s, th){

function drawCoin(c){
  var sq = Math.abs(Math.cos(c.t*3));
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(0.32 + sq*0.68, 1);
  ctx.fillStyle = '#f7c93b';
  ctx.beginPath(); ctx.arc(0,0,c.r,0,6.3); ctx.fill();
  ctx.fillStyle = '#ffeaa6';
  ctx.beginPath(); ctx.arc(0,0,c.r*0.62,0,6.3); ctx.fill();

function drawQBlock(q, th){
  if(q.broken) return;
  var off = q.bump > 0 ? -q.bump*10 : 0;
  var x = q.x, y = q.y + off;
  ctx.save();
  if(q.used && q.kind === 'q'){
    ctx.fillStyle = '#b9b0a0';
    rr(x, y, q.w, q.h, 6); ctx.fill();
    ctx.strokeStyle = '#8a8375'; ctx.lineWidth = 3;
    rr(x, y, q.w, q.h, 6); ctx.stroke();
  }else if(q.kind === 'b'){
    ctx.fillStyle = th.dirt;
    rr(x, y, q.w, q.h, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x, y + q.h/2); ctx.lineTo(x + q.w, y + q.h/2);
    ctx.moveTo(x + q.w/2, y); ctx.lineTo(x + q.w/2, y + q.h/2);
    ctx.moveTo(x + q.w/4, y + q.h/2); ctx.lineTo(x + q.w/4, y + q.h);
    ctx.moveTo(x + q.w*0.75, y + q.h/2); ctx.lineTo(x + q.w*0.75, y + q.h);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.2)';
    rr(x+1, y+1, q.w-2, q.h-2, 4); ctx.stroke();
  }else{
    var g = ctx.createLinearGradient(x, y, x, y + q.h);
    g.addColorStop(0,'#ffe485'); g.addColorStop(1,'#e59a10');
    ctx.fillStyle = g;
    rr(x, y, q.w, q.h, 8); ctx.fill();
    ctx.strokeStyle = '#a86a05'; ctx.lineWidth = 3.5;
    rr(x, y, q.w, q.h, 8); ctx.stroke();
    ctx.fillStyle = '#8a5600';
    ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', x + q.w/2, y + q.h/2 + 2);
  }
  ctx.restore();
}
function drawItem(m){
  ctx.save();
  ctx.translate(m.x + m.w/2, m.y + m.h/2);
  if(m.kind === 'mushroom'){
    ctx.fillStyle = '#f0e6d2';
    rr(-9, 0, 18, 15, 5); ctx.fill();
    ctx.fillStyle = '#e8453c';
    ctx.beginPath(); ctx.arc(0, 0, 16, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff4e2';
    ctx.beginPath();
    ctx.arc(-7,-6, 4.4, 0, 6.3); ctx.arc(7,-6, 4.4, 0, 6.3); ctx.arc(0,-11, 3.6, 0, 6.3);
    ctx.fill();
  }else{
    ctx.rotate(Math.sin(m.t*6)*0.25);
    ctx.fillStyle = 'hsl(' + ((G.t*300)%360) + ',95%,62%)';
    starShape(0,0, 17, 7, 5);
    ctx.fillStyle = '#fff6c9';
    starShape(0,0, 8, 3.4, 5);
  }
  ctx.restore();
}
function drawFlag(lv){
  var x = lv.flagX;
  var topY = GROUND_Y - 5.4*TILE;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  ctx.fillRect(x+5, topY+4, 7, GROUND_Y-topY);
  ctx.fillStyle = '#cfd6e3';
  ctx.fillRect(x, topY, 7, GROUND_Y-topY);
  ctx.fillStyle = '#ffd75e';
  ctx.beginPath(); ctx.arc(x+3.5, topY-6, 9, 0, 6.3); ctx.fill();

  var lit = G.activeGate >= lv.gates.length;
  var prog = lit ? Math.min(1, G.flagSlide > 0 ? G.flagSlide/1.2 : 0) : 0;
  var fy = topY + 14 + (GROUND_Y - topY - 96) * prog;
  ctx.fillStyle = lit ? '#ffca28' : '#9aa6c0';
  ctx.beginPath();
  ctx.moveTo(x+7, fy);
  ctx.lineTo(x+88, fy+30);
  ctx.lineTo(x+7, fy+60);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = lit ? '#5b3b00' : '#39415c';
  ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('星', x+38, fy+30);
  if(lit){
    ctx.globalAlpha = 0.3 + Math.abs(Math.sin(G.t*5))*0.25;
    ctx.fillStyle = '#ffeaa6';
    ctx.beginPath(); ctx.arc(x+3.5, topY-6, 18, 0, 6.3); ctx.fill();
  }
  ctx.restore();
}
function drawQuizBlock(b, gate){
  var st = b.state;
  var bob = (st === 'active') ? Math.sin(G.t*3 + b.x*0.011)*3 : 0;
  var off = b.shake > 0 ? Math.sin(G.t*60)*5*b.shake : 0;
  ctx.save();
  ctx.translate(off, bob);
  ctx.globalAlpha = (st === 'locked' || st === 'dim') ? 0.34 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  rr(b.x+4, b.y+7, b.w, b.h, 12); ctx.fill();
  var g = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
  if(st === 'correct'){ g.addColorStop(0,'#9bf0b6'); g.addColorStop(1,'#24a05a'); }
  else if(st === 'wrong'){ g.addColorStop(0,'#b8bfcf'); g.addColorStop(1,'#787f93'); }
  else { g.addColorStop(0,'#ffe485'); g.addColorStop(1,'#e59a10'); }
  ctx.fillStyle = g;
  rr(b.x, b.y, b.w, b.h, 12); ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = (st === 'correct') ? '#0c6b38' : ((st === 'wrong') ? '#575c6b' : '#a86a05');
  rr(b.x, b.y, b.w, b.h, 12); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  rr(b.x+7, b.y+6, b.w-14, 11, 6); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = (st === 'correct') ? '#04371d' : ((st === 'wrong') ? '#3a3e4b' : '#4a2f00');
  var parts = String(b.gloss).split('；').filter(Boolean);
  if(parts.length > 1){
    ctx.font = 'bold 19px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(parts[0], b.x+b.w/2, b.y+b.h/2-13);
    ctx.fillText(parts[1], b.x+b.w/2, b.y+b.h/2+13);
  }else{
    ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(parts[0] || '', b.x+b.w/2, b.y+b.h/2);
  }
  ctx.font = 'bold 24px sans-serif';
  if(st === 'correct'){ ctx.fillStyle = '#0c6b38'; ctx.fillText('✓', b.x+b.w-17, b.y+4); }
  if(st === 'wrong'){ ctx.fillStyle = '#575c6b'; ctx.fillText('✕', b.x+b.w-17, b.y+4); }
  ctx.restore();
}

function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x + e.w/2, e.y + e.h/2);
  var wob = Math.sin(e.t*7)*0.1;
  ctx.scale(1+wob, 1-wob);
  var main = e.kind === 'spike' ? '#7b56c9' : (e.kind === 'fly' ? '#4f8fe0' : '#9a5ad0');
  var light = e.kind === 'spike' ? '#a98ce8' : (e.kind === 'fly' ? '#9ad0ff' : '#c79bee');

  if(e.kind === 'fly'){
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    var fw = Math.sin(e.t*16)*0.5 + 0.5;
    ctx.beginPath(); ctx.ellipse(-e.w*0.5, -6, 12, 7*fw+3, -0.5, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.ellipse(e.w*0.5, -6, 12, 7*fw+3, 0.5, 0, 6.3); ctx.fill();
  }
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.arc(0, 0, e.w*0.5, Math.PI, 0);
  ctx.lineTo(e.w*0.5, e.h*0.34);
  ctx.quadraticCurveTo(0, e.h*0.62, -e.w*0.5, e.h*0.34);
  ctx.closePath(); ctx.fill();

  if(e.kind === 'spike'){
    ctx.fillStyle = '#efe6ff';
    for(var s=-2;s<=2;s++){
      ctx.beginPath();
      ctx.moveTo(s*9-4, -e.h*0.42);
      ctx.lineTo(s*9, -e.h*0.74);
      ctx.lineTo(s*9+4, -e.h*0.42);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.fillStyle = light;
  ctx.beginPath(); ctx.arc(-6,-5, 6, 0, 6.3); ctx.arc(6,-5, 6, 0, 6.3); ctx.fill();
  ctx.strokeStyle = '#3b1a52';
  ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-12,-11); ctx.lineTo(-2,-1);
  ctx.moveTo(-2,-11); ctx.lineTo(-12,-1);
  ctx.moveTo(2,-11); ctx.lineTo(12,-1);
  ctx.moveTo(12,-11); ctx.lineTo(2,-1);
  ctx.stroke();
  ctx.fillStyle = '#4a2263';
  ctx.fillRect(-14, e.h*0.46, 10, 6);
  ctx.fillRect(4, e.h*0.46, 10, 6);
  ctx.restore();
}
function drawPlayer(p, invuln, big, star){
  if(!p) return;
  if(invuln > 0 && star <= 0 && Math.floor(G.t*18)%2 === 0) return;
  var scale = big ? 1.38 : 1;
  var hue = star > 0 ? (G.t*420)%360 : null;
  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h);
  var st = clamp(p.vy/1500, -0.2, 0.24);
  ctx.scale(1 - st*0.55, 1 + st*0.55);
  ctx.scale(p.face*scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(0, 3, 18, 5, 0, 0, 6.3); ctx.fill();
  var sw = p.onGround ? Math.sin(p.anim*3.4)*5 : 3;
  ctx.fillStyle = '#25406e';
  rr(-11+sw, -13, 9, 15, 4); ctx.fill();
  rr(2-sw, -13, 9, 15, 4); ctx.fill();
  var bg = ctx.createLinearGradient(0,-48,0,-4);
  if(hue === null){
    bg.addColorStop(0,'#ff9f43');
    bg.addColorStop(1,'#ee5a26');
  }else{
    bg.addColorStop(0,'hsl(' + hue + ',95%,66%)');
    bg.addColorStop(1,'hsl(' + ((hue+40)%360) + ',90%,52%)');
  }
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0,-27, 17, 21, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = (hue === null) ? '#ffca3a' : 'hsl(' + ((hue+180)%360) + ',95%,68%)';
  ctx.beginPath();
  ctx.moveTo(-14,-43); ctx.quadraticCurveTo(-20,-59,-6,-53); ctx.quadraticCurveTo(-10,-47,-4,-45); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(6,-47); ctx.quadraticCurveTo(16,-65,20,-47); ctx.quadraticCurveTo(14,-43,6,-45); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff8ec';
  ctx.beginPath(); ctx.ellipse(2,-28, 12, 12, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#16204a';
  ctx.beginPath(); ctx.arc(6,-31, 3.4, 0, 6.3); ctx.arc(-2,-31, 3, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(7.4,-32.2, 1.3, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,120,.5)';
  ctx.beginPath(); ctx.arc(-6,-24, 3.2, 0, 6.3); ctx.fill();
  if(big){
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(0,-6, 3, 0, 6.3); ctx.fill();
  }
  ctx.restore();
}

/* ============================ 主渲染 ============================ */
function render(){
  var lv = G.lv;
  var th = (lv && lv.th) || THEMES.grass;
  var i;
  ctx.save();
  if(G.shake > 0) ctx.translate(rand(-G.shake,G.shake)*0.5, rand(-G.shake,G.shake)*0.3);

  drawSky(th);
  drawHills(th, G.cam*0.15, 322, 150, th.hill[0]);
  drawHills(th, G.cam*0.32, 392, 118, th.hill[1]);
  drawClouds(th, G.cam*0.2);

  if(lv){
    ctx.translate(-G.cam, 0);
    drawDecor(lv);
    for(i=0;i<lv.solids.length;i++){
      var s = lv.solids[i];
      if(s.x+s.w < G.cam-100 || s.x > G.cam+VW+100) continue;
      if(s.type === 'ground') drawGround(s, th);
      else if(s.type === 'pipe') drawPipe(s);
      else if(s.type === 'stair') drawStair(s, th);
      else drawPlat(s, th);
    }
    for(i=0;i<lv.qblocks.length;i++) drawQBlock(lv.qblocks[i], th);
    for(i=0;i<lv.coins.length;i++){
      var co = lv.coins[i];
      if(co.got || co.x < G.cam-50 || co.x > G.cam+VW+50) continue;
      drawCoin(co);
    }
    drawFlag(lv);
    for(i=0;i<lv.gates.length;i++){
      var gate = lv.gates[i];
      if(gate.x < G.cam-360 || gate.x > G.cam+VW+360) continue;
      for(var j=0;j<gate.blocks.length;j++) drawQuizBlock(gate.blocks[j], gate);
    }
    for(i=0;i<lv.items.length;i++) drawItem(lv.items[i]);
    for(i=0;i<lv.enemies.length;i++){ if(lv.enemies[i].alive) drawEnemy(lv.enemies[i]); }

    for(i=0;i<G.particles.length;i++){
      var pt = G.particles[i];
      ctx.globalAlpha = Math.max(0, 1 - pt.t/pt.life);
      ctx.fillStyle = pt.c;
      ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for(i=0;i<G.popups.length;i++){
      var pp = G.popups[i];
      ctx.globalAlpha = Math.max(0, 1 - pp.t/pp.life);
      ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,.45)';
      ctx.strokeText(pp.text, pp.x, pp.y);
      ctx.fillStyle = pp.c;
      ctx.fillText(pp.text, pp.x, pp.y);
    }
    ctx.globalAlpha = 1;
    drawPlayer(G.player, G.invuln, G.big, G.star);
  }
  ctx.restore();

  if(G.banner > 0 && lv) drawBanner(lv);
}
function countTier(lv, t){
  var n = 0;
  for(var i=0;i<lv.gates.length;i++){ if(lv.gates[i].word.t === t) n++; }
  return n;
}
function drawBanner(lv){
  var a = Math.min(1, G.banner/0.4);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(10,14,30,.62)';
  ctx.fillRect(0, 78, VW, 150);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(lv.def.unit + '　' + lv.def.name, VW/2, 78+52);
  ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffd75e';
  ctx.fillText('共 ' + lv.gates.length + ' 个单词　·　易 ' + countTier(lv,1) +
    '　中 ' + countTier(lv,2) + '　难 ' + countTier(lv,3), VW/2, 78+108);
  ctx.restore();
}

/* ============================ 界面 ============================ */
function totalStars(){
  var n = 0;
  for(var k in save.stars){ if(Object.prototype.hasOwnProperty.call(save.stars,k)) n += save.stars[k]; }
  return n;
}
function clearedCount(){
  var n = 0;
  for(var k in save.stars){ if(save.stars[k] > 0) n++; }
  return n;
}
function chapterOf(levelIndex){ return Math.floor(levelIndex / CH_SIZE); }
function isLevelUnlocked(i){ return chapterOf(i) < save.unlocked; }
function nextLevelIndex(){
  for(var i=0;i<LEVELS.length;i++){
    if(!isLevelUnlocked(i)) break;
    if(!save.stars[LEVELS[i].id]) return i;
  }
  return Math.max(0, Math.min(LEVELS.length - 1, save.unlocked * CH_SIZE - 1));
}

      '<button class="btn ghost" id="mStart">选择关卡（' + LEVELS.length + '）</button>' +
      '<button class="btn ghost" id="mWords">生词本（' + WORDS.length + ' 词 · 可开打）</button>' +
      '<button class="btn ghost" id="mWrong"' + (wb ? '' : ' disabled') + '>错词本闯关（' + wb + ' 词）</button>' +
      '<button class="btn ghost" id="mSet">设置</button>' +
    '</div>'
  );
  $('mGo').onclick = function(){ startLevel(nxt); };
  $('mStart').onclick = levelSelect;
  $('mWords').onclick = function(){ wordBook(); };
  $('mWrong').onclick = startWrongDrill;
  $('mSet').onclick = settings;
}

function levelSelect(){
  G.state = 'select';
  var html = '';
  for(var c=0;c<CHAPTERS.length;c++){
    var ch = CHAPTERS[c];
    var lockedCh = c >= save.unlocked;
    var done = 0, stars = 0;
    for(var k=ch.from;k<ch.to;k++){ if(save.stars[LEVELS[k].id]) done++; stars += save.stars[LEVELS[k].id] || 0; }
    html += '<div class="chapHead">' +
      '<div class="chapNo">第 ' + ch.no + ' 章</div>' +
      '<div class="chapName">' + ch.name + (lockedCh ? ' <span class="lockTag">未解锁</span>' : '') + '</div>' +
      '<div class="chapProg">' + done + '/' + (ch.to - ch.from) + ' 关　★' + stars + '/' + ((ch.to-ch.from)*3) + '</div>' +
    '</div><div class="grid">';
    for(var i=ch.from;i<ch.to;i++){
      var d = LEVELS[i];
      var locked = !isLevelUnlocked(i);
      var st = save.stars[d.id] || 0;
      html += '<button class="lvl ' + (locked ? 'locked' : '') + '" data-i="' + i + '"' + (locked ? ' disabled' : '') + '>' +
        (locked ? '<span class="lock">🔒</span>' : '') +
        '<div class="no">' + d.unit + '　<span class="wc">' + (d.to - d.from) + ' 词</span></div>' +
        '<div class="nm">' + WORDS[d.from].w + ' …</div>' +
        '<div class="stars">' + starHtml(st) + '</div>' +
      '</button>';
    }
    html += '</div>';
  }
  showOverlay(
    '<h2>选择关卡</h2>' +
    '<p>共 ' + LEVELS.length + ' 关，每 10 关一章（' + WORDS.length + ' 个六级词）。' +
    '每关 20 词，「易 + 中 + 难」混排；通关任意一关即可解锁下一章。</p>' +
    html +
    '<div class="btnRow">' +
      '<button class="btn ghost" id="back">返回主菜单</button>' +
      '<button class="btn ghost" id="wb2">生词表</button>' +
    '</div>'
  );
  $('back').onclick = menu;
  $('wb2').onclick = function(){ wordBook(); };
  var els = document.querySelectorAll('.lvl');
  for(var k=0;k<els.length;k++){
    if(els[k].classList.contains('locked')) continue;
    els[k].onclick = (function(el){
      return function(){ startLevel(parseInt(el.getAttribute('data-i'), 10)); };
    })(els[k]);
  }
}

function wordBook(){
  G.state = 'words';
  var html = '';
  for(var i=0;i<LEVELS.length;i++){
    var d = LEVELS[i];
    html += '<div style="margin-top:1.1em">' +
      '<div style="display:flex;align-items:center;gap:.6em;flex-wrap:wrap;margin-bottom:.45em">' +
        '<div style="font-weight:800">' + d.unit + ' · ' + d.name +
        ' <span class="tag">' + (d.to-d.from) + ' 词</span></div>' +
        '<button class="btn ghost" style="margin-left:auto;padding:.42em .9em;font-size:.85em" ' +
          'data-play="' + i + '">▶ 打这一组</button>' +
      '</div><div class="wordList">';
    for(var j=d.from;j<d.to;j++){
      var idx = WORDS.indexOf(WORDS[j]);
      html += wordRow(WORDS[j], null, save.wrongBook[idx] ? 'wrong' : '');
    }
    html += '</div></div>';
  }
  showOverlay(
    '<h2>生词本 · ' + WORDS.length + ' 词</h2>' +
    '<p>词库来自《大学英语六级词汇乱序版》，共 ' + WORDS.length + ' 词，按 ' + LEVELS.length +
    ' 关分组（每组 20 词）。点 🔊 听发音，点「▶ 打这一组」可以直接把这 20 个词当成一关来闯。</p>' + html +
    '<div class="btnRow">' +
      '<button class="btn" id="back">返回</button>' +
      '<button class="btn ghost" id="all">按顺序朗读全部</button>' +
    '</div>'
  );
  $('back').onclick = menu;
  bindSpeak($('card'));
  var pbs = $('card').querySelectorAll('[data-play]');
  for(var p=0;p<pbs.length;p++){
    (function(b){ b.onclick = function(){ startPractice(parseInt(b.getAttribute('data-play'), 10)); }; })(pbs[p]);
  }
  $('all').onclick = function(){
    var i = 0;
    speak(WORDS[0].w);
    var timer = setInterval(function(){
      i++;
      if(i >= WORDS.length || G.state !== 'words'){ clearInterval(timer); return; }
      speak(WORDS[i].w);
    }, 1700);
  };
}

function settings(){
  G.state = 'settings';
  showOverlay(
    '<h2>设置</h2>' +
    '<p>音效与朗读使用浏览器自带能力，完全离线。手机首次点击屏幕后音效才会生效（系统限制）。</p>' +
    '<div class="btnRow" style="margin-top:.2em">' +
      '<button class="btn ' + (save.sound ? '' : 'ghost') + '" id="s1">音效：' + (save.sound ? '开' : '关') + '</button>' +
      '<button class="btn ' + (save.voice ? '' : 'ghost') + '" id="s2">单词朗读：' + (save.voice ? '开' : '关') + '</button>' +
      '<button class="btn ' + (save.timer ? '' : 'ghost') + '" id="s3">关卡倒计时：' + (save.timer ? '开' : '关') + '</button>' +
    '</div>' +
    '<div class="hint">倒计时关掉后就是纯休闲模式，不会被时间扣心。手机建议横屏 + 全屏（右上角 ⛶）。</div>' +
    '<div class="btnRow">' +
      '<button class="btn ghost" id="back">返回</button>' +
      '<button class="btn ghost" id="reset">清除全部进度</button>' +
    '</div>'
  );
  $('s1').onclick = function(){ save.sound = !save.sound; save.persist(); settings(); };
  $('s2').onclick = function(){ save.voice = !save.voice; save.persist(); settings(); };
  $('s3').onclick = function(){ save.timer = !save.timer; save.persist(); settings(); };
  $('back').onclick = menu;
  $('reset').onclick = function(){
    if(window.confirm('确定清除所有通关进度、星星、金币和错词本？这一步不能撤销。')){
      save.unlocked = 1; save.stars = {}; save.best = {}; save.wrongBook = {}; save.coins = 0;
      save.persist(); menu();
    }
  };
}

function levelClear(){
  if(G.state !== 'playing') return;
  G.state = 'clear';
  G.finished = true;
  SFX.clear();
  var lv = G.lv;
  var isDrill = !!G.customWords;
  var id = (lv.def && lv.def.id) || 'L1';
  var secs = Math.max(1, (performance.now() - G.startedAt)/1000);
  var timeBonus = save.timer ? Math.max(0, Math.round((200 - secs)*2)) : 60;
  var total = G.score + timeBonus;
  var stars = (G.wrongCount === 0) ? 3 : (G.wrongCount <= 2 ? 2 : 1);

  save.coins += G.coinsRun;
  if(!isDrill){
    save.stars[id] = Math.max(save.stars[id] || 0, stars);
    save.best[id] = Math.max(save.best[id] || 0, total);
    var idx = -1;
    for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].id === id) idx = i; }
    if(idx >= 0){
      /* 通关任意一关 → 解锁下一章（每章 10 关） */
      var want = chapterOf(idx) + 2;
      if(save.unlocked < want) save.unlocked = Math.min(CHAPTERS.length, want);
    }
  }else if(/^WB/.test(id)){
    save.stars[id] = Math.max(save.stars[id] || 0, stars);   /* 错词本关卡也记星，但不影响章节解锁 */
  }
  save.persist();

  var name = isDrill ? '错词重练' : (lv.def.name || '关卡');
  var rows = '';
  for(var g=0;g<lv.gates.length;g++) rows += wordRow(lv.gates[g].word, null, '');
  var nextBtn = '';
  if(!isDrill && G.levelIndex + 1 < LEVELS.length){
    nextBtn = '<button class="btn gold" id="next">下一关：' + LEVELS[G.levelIndex+1].name + '</button>';
  }
  showOverlay(
    '<div class="brand"><div class="logo">✓</div><div>' +
      '<h1 style="margin:0">过关！' + name + '</h1>' +
      '<div style="color:#f5b21f;font-size:2em;line-height:1.1;letter-spacing:.08em">' + starHtml(stars) + '</div>' +
    '</div></div>' +
    '<div class="stat">' +
      '<div><b>' + total + '</b><span>总得分（时间奖励 ' + timeBonus + '）</span></div>' +
      '<div><b>' + G.correctFirst + '/' + lv.gates.length + '</b><span>一次答对</span></div>' +
      '<div><b>' + G.coinsRun + '</b><span>本关金币</span></div>' +
      '<div><b>x' + G.bestStreak + '</b><span>最高连击</span></div>' +
      '<div><b>' + secs.toFixed(1) + 's</b><span>用时</span></div>' +
    '</div>' +
    '<h2 style="margin-top:1.1em;font-size:1.05em">本关单词回顾</h2>' +
    '<div class="wordList">' + rows + '</div>' +
    '<div class="btnRow">' + nextBtn +
      '<button class="btn" id="again">再玩一次</button>' +
      '<button class="btn ghost" id="back">返回主菜单</button>' +
    '</div>'
  );
  bindSpeak($('card'));
  if($('next')) $('next').onclick = function(){ startLevel(G.levelIndex+1); };
  $('again').onclick = restartCurrent;
  $('back').onclick = menu;
}

function levelFailed(){
  if(G.state === 'fail' || G.state === 'clear') return;
  G.state = 'fail';
  SFX.fail();
  var lv = G.lv;
  var bad = [];
  for(var i=0;i<lv.gates.length;i++){ if(lv.gates[i].tries > 0) bad.push(lv.gates[i]); }
  if(!bad.length) bad = lv.gates.slice(0, Math.min(6, lv.gates.length));
  var rows = '';
  for(var j=0;j<bad.length;j++) rows += wordRow(bad[j].word, '答错 ' + bad[j].tries + ' 次', 'wrong');
  var isDrill = !!G.customWords;
  showOverlay(
    '<div class="brand"><div class="logo" style="background:linear-gradient(160deg,#ff8fa0,#e0354c)">!</div><div>' +
      '<h1 style="margin:0">生命用完了</h1>' +
      '<p style="margin:0">先把这几个词读两遍，再打一次会轻松很多。</p>' +
    '</div></div>' +
    '<h2 style="font-size:1.05em;margin-top:1em">需要重点记的单词</h2>' +
    '<div class="wordList">' + rows + '</div>' +
    '<div class="btnRow">' +
      '<button class="btn gold" id="retry">重新挑战本关</button>' +
      '<button class="btn ghost" id="back">返回主菜单</button>' +
    '</div>'
  );
  bindSpeak($('card'));
  $('retry').onclick = restartCurrent;
  $('back').onclick = menu;
}

function pauseGame(){
  if(G.state !== 'playing') return;
  G.state = 'paused';
  var lv = G.lv;
  var rows = '';
  for(var i=0;i<G.activeGate && i<lv.gates.length;i++) rows += wordRow(lv.gates[i].word, null, '');
  if(!rows) rows = '<div class="wrow"><div class="cn">还没有答完的单词。</div></div>';
  showOverlay(
    '<h2>暂停</h2>' +
    '<p>' + (G.customWords ? '错词重练' : (lv.def.name || '关卡')) +
      '　·　进度 ' + G.activeGate + '/' + lv.gates.length +
      ' 词　·　得分 ' + G.score + '</p>' +
    '<div class="wordList">' + rows + '</div>' +
    '<div class="btnRow">' +
      '<button class="btn gold" id="resume">继续游戏</button>' +
      '<button class="btn" id="restart">重开本关</button>' +
      '<button class="btn ghost" id="home">返回主菜单</button>' +
    '</div>'
  );
  bindSpeak($('card'));
  $('resume').onclick = resumeGame;
  $('restart').onclick = restartCurrent;
  $('home').onclick = menu;
}
function resumeGame(){
  if(G.state !== 'paused') return;
  hideOverlay();
  G.state = 'playing';
  last = performance.now();
}

/* ---------- 横屏提示 ---------- */
var pausedByRotate = false;
var rotateDismissed = save.rotateSkip === true;   /* 选过「竖屏继续」后不再打扰 */
function resumeFromRotate(){
  $('rotate').classList.remove('show');
  if(pausedByRotate && G.state === 'paused'){
    pausedByRotate = false;
    hideOverlay();
    G.state = 'playing';
    last = performance.now();
  }
}
function checkOrientation(){
  var el = $('rotate');
  if(!el) return;
  var portrait = window.innerHeight > window.innerWidth * 1.05;
  var already = el.classList.contains('show');
  /* 注意：提示显示后状态会变成 paused，所以第二次触发时必须用 already 兜住，
     否则 resize 连续触发会把提示瞬间又关掉 */
  var show = IS_MOBILE && portrait && !rotateDismissed && (G.state === 'playing' || already);
  if(show){
    if(!already){
      el.classList.add('show');
      G.state = 'paused';
      pausedByRotate = true;
      hideOverlay();
      touchZones.clear();
      syncTouch();
    }
  }else if(!show){
    resumeFromRotate();
  }
}
$('rotSkip').onclick = function(){
  rotateDismissed = true; save.rotateSkip = true; save.persist(); resumeFromRotate();
};
$('rotFull').onclick = function(){
  rotateDismissed = true; save.rotateSkip = true; save.persist(); toggleFullscreen(); resumeFromRotate();
};
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', function(){ setTimeout(checkOrientation, 250); });

/* ---------- 全屏 ---------- */
function lockLandscape(){
  try{
    if(screen.orientation && screen.orientation.lock){
      var p = screen.orientation.lock('landscape');
      if(p && p.catch) p.catch(function(){});
    }
  }catch(e){}
}
function inFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen(){
  try{
    var el = document.documentElement;
    if(!inFullscreen()){
      if(el.requestFullscreen){
        var p = el.requestFullscreen();
        if(p && p.then) p.then(lockLandscape).catch(function(){});
      }else if(el.webkitRequestFullscreen){
        el.webkitRequestFullscreen();
        lockLandscape();
      }
    }else{
      if(document.exitFullscreen){
        var q = document.exitFullscreen();
        if(q && q.catch) q.catch(function(){});
      }else if(document.webkitExitFullscreen){
        document.webkitExitFullscreen();
      }
    }
  }catch(e){}
}
/* 手机端第一次点“开始”时顺手试着进全屏（必须发生在用户点击里，否则浏览器拒绝） */
var triedAutoFullscreen = false;
function maybeFullscreen(){
  if(!IS_MOBILE || triedAutoFullscreen) return;
  if(inFullscreen()){ lockLandscape(); return; }
  try{
    var el = document.documentElement;
    if(el.requestFullscreen){
      el.requestFullscreen().then(function(){
        triedAutoFullscreen = true;
        lockLandscape();
      }).catch(function(){
        /* 被拒绝（比如微信）就不锁定，下次点击再试一次 */
      });
    }else if(el.webkitRequestFullscreen){
      el.webkitRequestFullscreen();
      triedAutoFullscreen = true;
      lockLandscape();
    }
  }catch(e){}
}

/* ---------- 微信 / QQ 内置浏览器引导条 ---------- */
var UA_STR = navigator.userAgent || '';
var IN_WECHAT = /MicroMessenger/i.test(UA_STR);
var IN_QQ = (/\bQQ\/[\d.]+/i.test(UA_STR) || /QQBrowser/i.test(UA_STR)) && !/MicroMessenger/i.test(UA_STR);
var IS_IOS = /iPad|iPhone|iPod/.test(UA_STR) ||
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function showInAppTip(){
  var bar = $('wxbar');
  if(!bar || !IS_MOBILE || !(IN_WECHAT || IN_QQ)) return;
  var who = IN_WECHAT ? '微信' : 'QQ';
  var how = IS_IOS
    ? '点右上角 <span class="k">⋯</span> → <b>在 Safari 中打开</b>'
    : '点右上角 <span class="k">⋯</span> → <b>在浏览器打开</b>';
  $('wxbarTxt').innerHTML =
    '⚠️ ' + who + '内置浏览器不支持全屏，也没有「添加到主屏幕」。<br>' +
    '想要全屏横屏玩：' + how + '，再点浏览器菜单里的「添加到主屏幕」。';
  bar.classList.add('show');
  var h = bar.offsetHeight || 72;
  document.documentElement.style.setProperty('--wxh', h + 'px');
  $('hud').classList.add('wx');
  $('overlay').classList.add('wx');
}

/* ============================ HUD 绑定 ============================ */
$('btnPause').onclick = function(){
  if(G.state === 'playing') pauseGame();
  else if(G.state === 'paused') resumeGame();
};
$('btnSpeak').onclick = function(){
  var lv = G.lv;
  if(lv && lv.gates[G.activeGate]) speak(lv.gates[G.activeGate].word.w);
};
$('btnFull').onclick = toggleFullscreen;
$('wxbarX').onclick = function(){
  $('wxbar').classList.remove('show');
  $('hud').classList.remove('wx');
  $('overlay').classList.remove('wx');
};
$('btnSound').onclick = function(){
  save.sound = !save.sound;
  save.persist();
  $('btnSound').classList.toggle('off', !save.sound);
  toast(save.sound ? '音效已开' : '音效已关', null, 900);
};
document.addEventListener('visibilitychange', function(){
  if(document.hidden && G.state === 'playing') pauseGame();
});

/* ============================ 启动 ============================ */
if('speechSynthesis' in window){
  try{ window.speechSynthesis.getVoices(); }catch(e){}
}
$('btnSound').classList.toggle('off', !save.sound);
G.state = 'menu';
renderHearts();
showInAppTip();

var hashId = String(location.hash || '').replace('#','').toUpperCase();
var hashIdx = -1;
for(var hi=0;hi<LEVELS.length;hi++){ if(LEVELS[hi].id === hashId) hashIdx = hi; }
if(hashIdx >= 0 && hashIdx < save.unlocked) startLevel(hashIdx);
else menu();

requestAnimationFrame(loop);

})();

</script>
